[build-system]
requires = [
    "setuptools>=22",
]
build-backend = "setuptools.build_meta"

[project]
name = "clitools"
version = "0.2.2"
authors = [{name = "Paul Kremer"}]
description = "Collection of CLI tools written in Python"
license = {text = "MIT"}
classifiers = [
    "DO NOT UPLOAD",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3.11",
]
readme = "README.rst"
requires-python = ">=3.11"
dependencies = [
    "click >= 6.7",
    "chardet >= 2.1",
    "colorama",
    "IPy >= 0.83",
    "unidecode >= 0.04",
    "mutagen >= 1.39",
    "phx-class-registry >= 5.0",
    "pathspec>=0.5.9",
    "six",
    "python-gitlab",
    "python-slugify>=3.0.3",
    "pyfzf>=0.3.1",
]

[project.urls]
Homepage = "https://github.com/infothrill/python-clitools"

[project.scripts]
detectencoding = "clitools.detectencoding:main"
digssh = "clitools.digssh:main"
fs-lint = "clitools.fs_lint:fs_lint"
gitlab-shared-runners = "clitools.gitlab_shared_runners:main"
id3v1toid3v2 = "clitools.id3v1toid3v2:main"
autocropscans = "clitools.autocropscans:main"
note = "clitools.note:main"
onlinepingcheck = "clitools.onlinepingcheck:main"
rdiff-backup-wrapper = "clitools.rdiff_backup_wrapper:main"
rndpasswd = "clitools.rndpasswd:main"
rot13 = "clitools.rot13:main"
transliterate = "clitools.transliterate:main"
tomp3 = "clitools.tomp3:main"

[project.optional-dependencies]
testing = ["pytest>=3.0.7"]

[tool.setuptools]
data-files = {}
include-package-data = false

[tool.setuptools.packages]
find = {namespaces = false}

[tool.setuptools.package-data]
"clitools.tests.resources" = ["clitools/tests/resources/*.ini"]

[tool.flake8]
max_line_length = "120"
ignore = "W504"
exclude = ".git,__pycache__,.tox,dist,build,.eggs,.direnv,.venv"
per-file-ignores = """
clitools/tests/*.py:S101,E501"""
inline-quotes = "single"

[tool.coverage.run]
omit = ["clitools/tests/*"]

[tool.check-manifest]
ignore = [
".coveragerc",
".pre-commit-config.yaml",
".pylintrc",
".github",
".renovaterc.json",
".venv",
".tox",
"tox.ini",
"requirements-dev.txt"]
